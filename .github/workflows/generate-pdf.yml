name: Generate Golden Jubilee PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate PDF from the web reader
        run: npm run pdf:generate
      - name: Verify generated PDF
        run: |
          ls -lh public/golden-jubilee-high-resolution.pdf
          file public/golden-jubilee-high-resolution.pdf
      - name: Commit updated PDF
        run: |
          git config user.name "Golden Jubilee Publisher"
          git config user.email "actions@github.com"
          git add public/golden-jubilee-high-resolution.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update Golden Jubilee PDF editions"
            git push
          fi
