name: Generate E-Book PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build website
        run: npm run build

      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid

      - name: Wait for website
        run: npx wait-on http://127.0.0.1:4173

      - name: Generate PDF
        run: node scripts/generate-pdf.mjs

      - name: Check generated PDF
        run: |
          ls -lh public/golden_jubilee_ebook.pdf
          file public/golden_jubilee_ebook.pdf

      - name: Commit PDF
        run: |
          git config user.name "Golden Jubilee Publisher"
          git config user.email "actions@github.com"

          git add public/golden_jubilee_ebook.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update Golden Jubilee e-book PDF"
            git push
          fi