name: Generate Golden Jubilee PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ghostscript fonts-dejavu-core
      - name: Build website
        run: npm run build
      - name: Generate both PDFs
        run: python scripts/generate-pdfs.py
      - name: Verify generated PDFs
        run: |
          ls -lh public/golden-jubilee-high-resolution.pdf public/golden-jubilee-low-resolution.pdf
          file public/golden-jubilee-high-resolution.pdf public/golden-jubilee-low-resolution.pdf
      - name: Commit updated PDFs
        run: |
          git config user.name "Golden Jubilee Publisher"
          git config user.email "actions@github.com"
          git add public/golden-jubilee-high-resolution.pdf public/golden-jubilee-low-resolution.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update Golden Jubilee PDF editions"
            git push
          fi
